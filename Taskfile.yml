version: "3"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build membox binary
    cmds:
      - go build -o ./bin/membox ./cmd/memorybox

  install:
    desc: Install membox to /usr/local/bin
    cmds:
      - go build -o /usr/local/bin/membox ./cmd/memorybox
      - echo "Installed → /usr/local/bin/membox"

  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -count=1 ./...

  test-short:
    desc: Run tests without benchmarks
    cmds:
      - go test -short -race -count=1 ./...

  bench:
    desc: Run benchmarks (manifest and restore packages)
    cmds:
      - go test -bench=. -benchmem -run='^$' ./internal/manifest/... ./internal/restore/...

  bench-1m:
    desc: Run 1M-entry merge benchmark
    cmds:
      - go test -bench=BenchmarkMerge1M -benchmem -benchtime=3x -run='^$' ./internal/manifest/

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  release-dry:
    desc: Dry-run GoReleaser (no publish)
    cmds:
      - goreleaser release --snapshot --clean

  release:
    desc: Tag and release via GoReleaser (requires GITHUB_TOKEN)
    cmds:
      - goreleaser release --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf ./bin ./dist
